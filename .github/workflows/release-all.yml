name: Release All

# Build the boot CD and disk images of every platform LiberNT's own CI builds
# images for (i386, amd64, arm64-raspberry, riscv64-spacemit-k1, ppc) and
# attach them to a GitHub Release of this repository, replacing any file of
# the same name. The platforms and the build are in release-build.yml.
#
# Usage:
#   gh workflow run release-all.yml                      # new tag from version.cmake, date and commit
#   gh workflow run release-all.yml -f tag=v0.4.17-dev-20261107-5a85856
#
# To fill in only what a release is missing, use release-all-missing.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = v<version>-<date>-<commit> of this commit)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: libernt-release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
    with:
      mode: all
      tag: ${{ inputs.tag }}
